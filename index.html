<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Công ISUN – Tra cứu chấm công</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .day-cell { min-height: 64px; }
    .day-cell.weekend { background-color: #f8fafc; }
    .badge-L { background: #dbeafe; color: #1e40af; }
    .badge-P { background: #dcfce7; color: #166534; }
    .badge-O { background: #fee2e2; color: #991b1b; }
    .badge-Ô { background: #fef3c7; color: #92400e; }
    .badge-Rh { background: #e0e7ff; color: #3730a3; }
    .badge-B { background: #f3e8ff; color: #6b21a8; }
    .badge-A { background: #f1f5f9; color: #475569; }
    .badge-TV { background: #fecaca; color: #7f1d1d; }
    .badge-work { background: #ecfdf5; color: #065f46; }
    .badge-empty { background: #f1f5f9; color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-100 p-8">
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl mx-auto mb-3">IS</div>
        <h1 class="text-xl font-bold text-slate-900">Bảng Công ISUN</h1>
        <p class="text-sm text-slate-500 mt-1">Nhập mã số thẻ để xem chấm công của bạn</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mã số thẻ</label>
          <input type="text" id="login-code" autocomplete="username" autofocus placeholder="VD: IS000168"
                 class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase" />
        </div>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition">Đăng nhập</button>
      </form>
      <p class="text-xs text-slate-400 text-center mt-6">Chỉ xem được bảng công của chính mình ·
        <button type="button" id="btn-open-admin-from-login" class="underline text-slate-500 hover:text-slate-700">Admin cập nhật</button>
      </p>
      <p id="login-data-status" class="text-xs text-slate-400 text-center mt-2"></p>
    </div>
  </div>

  <div id="app-root" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg">IS</div>
          <div>
            <h1 class="text-lg font-bold text-slate-900 leading-tight">Bảng Công ISUN</h1>
            <p class="text-xs text-slate-500" id="file-info">—</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600 hidden sm:inline" id="logged-as"></span>
          <button id="btn-logout" type="button" class="px-3 py-2 text-sm font-medium rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">Đăng xuất</button>
        </div>
      </div>
    </header>
    <main class="max-w-3xl mx-auto px-4 py-6">
      <div id="detail-panel" class="space-y-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-900" id="detail-name">—</h2>
              <p class="text-sm text-slate-500 mt-0.5"><span id="detail-code" class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">—</span> · <span id="detail-dept">—</span></p>
            </div>
            <div class="text-right text-sm">
              <p class="text-slate-500">Ngày công tính lương</p>
              <p class="text-2xl font-bold text-blue-600" id="detail-paid-days">—</p>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="summary-cards"></div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
          <h3 class="font-semibold text-slate-800 mb-3">📅 Chi tiết từng ngày</h3>
          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
          <div class="mt-4 flex flex-wrap gap-2 text-xs" id="legend"></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 overflow-x-auto">
          <h3 class="font-semibold text-slate-800 mb-3">Giờ làm việc & Tăng ca</h3>
          <table class="w-full text-sm" id="hours-table">
            <thead><tr class="text-left text-slate-500 border-b"><th class="py-2 pr-3">Loại</th><th class="py-2 px-2 text-right">Tổng giờ</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="admin-overlay" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 p-6 my-8 space-y-4">
      <div class="flex items-start justify-between gap-2">
        <div>
          <h2 class="font-semibold text-slate-900">Cập nhật bảng công (Admin)</h2>
          <p class="text-sm text-slate-500">Upload Excel → đẩy lên GitHub</p>
        </div>
        <button type="button" id="btn-close-admin" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
      </div>
      <div class="bg-slate-50 rounded-lg border border-slate-100 p-4 space-y-2">
        <label class="block text-sm font-medium text-slate-700">GitHub Token</label>
        <div class="flex flex-wrap gap-2">
          <input type="password" id="gh-token" placeholder="ghp_xxxx" class="flex-1 min-w-[160px] px-3 py-2 text-sm border border-slate-200 rounded-lg" />
          <button type="button" id="btn-save-token" class="px-3 py-2 text-sm rounded-lg bg-slate-800 text-white">Lưu</button>
          <button type="button" id="btn-clear-token" class="px-3 py-2 text-sm rounded-lg bg-slate-100 text-slate-600">Xóa</button>
        </div>
        <p id="token-status" class="text-xs text-slate-600"></p>
      </div>
      <div class="bg-slate-50 rounded-lg border border-slate-100 p-4 space-y-3">
        <label class="block text-sm font-medium text-slate-700">File Excel</label>
        <div class="flex flex-wrap gap-2 items-center">
          <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg">Chọn Excel<input type="file" id="file-input" accept=".xlsx,.xls" class="hidden" /></label>
          <button id="btn-push-github" type="button" disabled class="px-4 py-2 text-sm font-medium rounded-lg bg-emerald-600 text-white disabled:opacity-40">Đẩy lên GitHub</button>
          <button id="btn-download-datajs" type="button" disabled class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-200 text-slate-700 disabled:opacity-40">Tải data.js</button>
        </div>
        <p id="admin-status" class="text-sm text-slate-600"></p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const GH_OWNER='hieunt0509k-max',GH_REPO='bang-cong-isun',GH_PATH='data.js';
    const TOKEN_KEY='bangcong_gh_token',SESSION_KEY='bangcong_logged_code';
    let allEmployees=[],monthInfo={year:2026,month:9},sharedMeta={},pendingSharedPayload=null,currentEmp=null;
    const loginScreen=document.getElementById('login-screen');
    const appRoot=document.getElementById('app-root');
    const loginForm=document.getElementById('login-form');
    const loginCode=document.getElementById('login-code');
    const loginError=document.getElementById('login-error');
    const loginDataStatus=document.getElementById('login-data-status');

    async function loadSharedData(){
      try{
        if(!(window.__SHARED_DATA__&&window.__SHARED_DATA__.employees)){
          const res=await fetch('data.js?t='+Date.now());
          if(!res.ok)throw new Error('no data');
          eval(await res.text());
        }
        const data=window.__SHARED_DATA__;
        if(!data||!data.employees)throw new Error('empty');
        allEmployees=data.employees.map(normalizeEmp);
        if(data.year)monthInfo.year=data.year;
        if(data.month)monthInfo.month=data.month;
        sharedMeta=data;
        loginDataStatus.textContent=(data.title||'')+' · '+allEmployees.length+' NV';
        const saved=sessionStorage.getItem(SESSION_KEY);
        if(saved)tryLogin(saved,true);
      }catch(e){
        console.warn(e);
        loginDataStatus.textContent='Chưa có dữ liệu — Admin cần cập nhật bảng công';
      }
    }

    function normalizeEmp(e){
      const hours=e.hours||{};
      ['dayAdmin','dayOT','nightAdmin','nightOT','holidayDay','holidayNight','sundayDay','sundayNight'].forEach(k=>{if(!hours[k])hours[k]={};});
      const leave={};Object.keys(e.leave||{}).forEach(k=>{leave[Number(k)]=e.leave[k];});
      const h2={};Object.keys(hours).forEach(cat=>{h2[cat]={};Object.keys(hours[cat]||{}).forEach(d=>{h2[cat][Number(d)]=hours[cat][d];});});
      const hasHours=Object.values(h2).some(o=>Object.keys(o).length>0);
      if(!hasHours){for(let d=1;d<=31;d++){if(!leave[d])h2.dayAdmin[d]=8;}}
      return{id:e.id,stt:e.stt,code:String(e.code||'').trim().toUpperCase(),name:e.name,dept:e.dept,sheet:e.sheet,leave:leave,hours:h2,summary:e.summary||{}};
    }

    function formatDate(iso){try{return new Date(iso).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return iso;}}

    loginForm.addEventListener('submit',e=>{e.preventDefault();tryLogin(loginCode.value,false);});

    function tryLogin(codeRaw,silent){
      const code=String(codeRaw||'').trim().toUpperCase();
      if(!code){if(!silent)showLoginError('Vui lòng nhập mã số thẻ');return;}
      if(!allEmployees.length){if(!silent)showLoginError('Chưa có dữ liệu bảng công');return;}
      const emp=allEmployees.find(e=>e.code===code);
      if(!emp){if(!silent)showLoginError('Mã số thẻ không đúng hoặc không có trong bảng công tháng này');sessionStorage.removeItem(SESSION_KEY);return;}
      loginError.classList.add('hidden');
      sessionStorage.setItem(SESSION_KEY,code);
      currentEmp=emp;
      showApp(emp);
    }

    function showLoginError(msg){loginError.textContent=msg;loginError.classList.remove('hidden');}

    function showApp(emp){
      loginScreen.classList.add('hidden');
      appRoot.classList.remove('hidden');
      const title=sharedMeta.title||('Tháng '+monthInfo.month+'/'+monthInfo.year);
      document.getElementById('file-info').textContent=title+(sharedMeta.updated?' · '+formatDate(sharedMeta.updated):'');
      document.getElementById('logged-as').textContent=emp.code;
      renderEmployee(emp);
    }

    document.getElementById('btn-logout').addEventListener('click',()=>{
      sessionStorage.removeItem(SESSION_KEY);currentEmp=null;
      appRoot.classList.add('hidden');loginScreen.classList.remove('hidden');
      loginCode.value='';loginCode.focus();
    });

    function renderEmployee(emp){
      document.getElementById('detail-name').textContent=emp.name;
      document.getElementById('detail-code').textContent=emp.code;
      document.getElementById('detail-dept').textContent=emp.dept||'—';
      document.getElementById('detail-paid-days').textContent=emp.summary.paidWorkDays||0;
      const cards=[
        {label:'Ngày đi làm thực tế',value:emp.summary.actualWorkDays,color:'text-slate-800'},
        {label:'Tổng tăng ca (giờ)',value:emp.summary.totalOT,color:'text-amber-600'},
        {label:'Hỗ trợ ăn ca (lần)',value:emp.summary.otSubsidyCount,color:'text-cyan-600'},
        {label:'Nghỉ hưởng lương',value:emp.summary.totalPaidLeave,color:'text-emerald-600'},
        {label:'Nghỉ không lương',value:emp.summary.totalUnpaidLeave,color:'text-red-600'},
        {label:'Tăng ca ngày',value:emp.summary.otDay,color:'text-blue-600'},
        {label:'Tăng ca Chủ nhật',value:emp.summary.sundayDay,color:'text-purple-600'},
        {label:'Quên chấm công',value:emp.summary.forgotPunch,color:'text-orange-600'},
        {label:'Đi muộn >10p',value:emp.summary.lateOver10,color:'text-rose-600'}
      ];
      document.getElementById('summary-cards').innerHTML=cards.map(c=>'<div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100"><p class="text-xs text-slate-500 mb-1">'+c.label+'</p><p class="text-lg font-bold '+c.color+'">'+(c.value??0)+'</p></div>').join('');
      renderCalendar(emp);renderHoursTable(emp);
    }

    function renderCalendar(emp){
      const year=monthInfo.year,month=monthInfo.month;
      const daysInMonth=new Date(year,month,0).getDate();
      const firstDow=new Date(year,month-1,1).getDay();
      let html=['CN','T2','T3','T4','T5','T6','T7'].map(d=>'<div class="font-semibold text-slate-500 py-1">'+d+'</div>').join('');
      for(let i=0;i<firstDow;i++)html+='<div class="day-cell"></div>';
      for(let day=1;day<=daysInMonth;day++){
        const date=new Date(year,month-1,day);
        const isWeekend=date.getDay()===0||date.getDay()===6;
        const leave=emp.leave[day];
        const dayH=emp.hours.dayAdmin[day]||0;
        const ot=(emp.hours.dayOT[day]||0)+(emp.hours.sundayDay[day]||0)+(emp.hours.holidayDay[day]||0)+(emp.hours.nightOT[day]||0)+(emp.hours.sundayNight[day]||0)+(emp.hours.holidayNight[day]||0);
        let badge='',badgeClass='badge-empty',sub='';
        if(leave){badge=leave;if(leave==='L')badgeClass='badge-L';else if(leave==='P'||String(leave).indexOf('P')===0)badgeClass='badge-P';else if(leave==='O')badgeClass='badge-O';else if(leave==='Ô')badgeClass='badge-Ô';else if(leave==='Rh')badgeClass='badge-Rh';else if(leave==='B')badgeClass='badge-B';else if(leave==='A')badgeClass='badge-A';else if(leave==='TV')badgeClass='badge-TV';}
        else if(dayH>0){badge=dayH;badgeClass='badge-work';if(ot>0)sub='+'+ot+'h';}
        else if(ot>0){badge='+'+ot+'h';badgeClass='badge-work';}
        else badge='—';
        html+='<div class="day-cell rounded-lg border border-slate-100 p-1'+(isWeekend?' weekend':'')+'">'+'<div class="text-[10px] text-slate-400 font-medium">'+day+'</div>'+'<div class="mt-0.5 inline-block px-1.5 py-0.5 rounded text-[11px] font-semibold '+badgeClass+'">'+badge+'</div>'+(sub?'<div class="text-[10px] text-amber-600 font-medium">'+sub+'</div>':'')+'</div>';
      }
      document.getElementById('calendar-grid').innerHTML=html;
      document.getElementById('legend').innerHTML=[{c:'badge-work',t:'Đi làm'},{c:'badge-L',t:'L – Nghỉ lễ'},{c:'badge-P',t:'P – Phép năm'},{c:'badge-O',t:'O – Việc riêng'},{c:'badge-Ô',t:'Ô – Ốm'},{c:'badge-Rh',t:'Rh – Chế độ'},{c:'badge-B',t:'B – Luân phiên'},{c:'badge-TV',t:'TV – Thôi việc'}].map(x=>'<span class="inline-flex items-center gap-1"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold '+x.c+'">'+x.t.split(' – ')[0]+'</span>'+(x.t.indexOf('–')>=0?x.t.split(' – ')[1]:'')+'</span>').join('');
    }

    function renderHoursTable(emp){
      const rows=[{label:'Ca ngày – Tăng ca',key:'otDay'},{label:'Ca đêm – Tăng ca',key:'otNight'},{label:'Chủ nhật – Ngày',key:'sundayDay'},{label:'Chủ nhật – Đêm',key:'sundayNight'},{label:'Ngày lễ – Ngày',key:'holidayDay'},{label:'Ngày lễ – Đêm',key:'holidayNight'},{label:'TỔNG TĂNG CA',key:'totalOT',bold:true}];
      document.querySelector('#hours-table tbody').innerHTML=rows.map(r=>{const val=emp.summary[r.key]||0;if(!val&&!r.bold)return'';return'<tr class="border-b border-slate-50'+(r.bold?' font-bold bg-slate-50':'')+'"><td class="py-2 pr-3">'+r.label+'</td><td class="py-2 px-2 text-right">'+Number(val).toLocaleString('vi-VN')+'</td></tr>';}).join('');
    }

    const adminOverlay=document.getElementById('admin-overlay');
    const fileInput=document.getElementById('file-input');
    const btnDownload=document.getElementById('btn-download-datajs');
    const btnPush=document.getElementById('btn-push-github');
    const adminStatus=document.getElementById('admin-status');
    const tokenInput=document.getElementById('gh-token');
    const tokenStatus=document.getElementById('token-status');

    document.getElementById('btn-open-admin-from-login').addEventListener('click',()=>adminOverlay.classList.remove('hidden'));
    document.getElementById('btn-close-admin').addEventListener('click',()=>adminOverlay.classList.add('hidden'));

    function getToken(){return(localStorage.getItem(TOKEN_KEY)||tokenInput.value||'').trim();}
    function refreshTokenUI(){const t=localStorage.getItem(TOKEN_KEY);if(t){tokenInput.value=t;tokenStatus.innerHTML='<span class="text-emerald-600">✓ Đã lưu token</span>';}else tokenStatus.textContent='Chưa có token';}
    document.getElementById('btn-save-token').addEventListener('click',()=>{const t=tokenInput.value.trim();if(!t){tokenStatus.textContent='Token trống';return;}localStorage.setItem(TOKEN_KEY,t);refreshTokenUI();});
    document.getElementById('btn-clear-token').addEventListener('click',()=>{localStorage.removeItem(TOKEN_KEY);tokenInput.value='';refreshTokenUI();});
    refreshTokenUI();

    fileInput.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});

    function loadFile(file){
      adminStatus.textContent='Đang đọc file...';btnDownload.disabled=true;btnPush.disabled=true;
      const reader=new FileReader();
      reader.onload=e=>{
        try{
          const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
          const payload=buildSharedPayload(wb,file.name);
          pendingSharedPayload=payload;
          allEmployees=payload.employees.map(normalizeEmp);
          sharedMeta=payload;window.__SHARED_DATA__=payload;
          loginDataStatus.textContent=payload.title+' · '+payload.employees.length+' NV (chưa public)';
          btnDownload.disabled=false;btnPush.disabled=false;
          adminStatus.textContent='Đã đọc '+payload.employees.length+' NV · Bấm Đẩy lên GitHub';
        }catch(err){adminStatus.textContent='Lỗi: '+err.message;alert('Không đọc được file.\n'+err.message);}
      };
      reader.readAsArrayBuffer(file);
    }

    btnDownload.addEventListener('click',()=>{
      if(!pendingSharedPayload)return;
      const js='window.__SHARED_DATA__='+JSON.stringify(pendingSharedPayload)+';';
      const blob=new Blob([js],{type:'application/javascript;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.js';a.click();URL.revokeObjectURL(a.href);
      adminStatus.textContent='Đã tải data.js';
    });

    btnPush.addEventListener('click',async()=>{
      if(!pendingSharedPayload)return;
      const token=getToken();
      if(!token){adminStatus.textContent='Chưa có GitHub Token';return;}
      btnPush.disabled=true;adminStatus.textContent='Đang đẩy lên GitHub...';
      try{
        await pushDataJsToGitHub(token,pendingSharedPayload);
        adminStatus.innerHTML='<span class="text-emerald-700 font-medium">✓ Đã đẩy lên GitHub.</span> Đợi ~1 phút.';
        loginDataStatus.textContent=pendingSharedPayload.title+' · '+pendingSharedPayload.employees.length+' NV';
      }catch(err){adminStatus.innerHTML='<span class="text-red-600">Lỗi: '+escapeHtml(err.message)+'</span>';}
      finally{btnPush.disabled=false;}
    });

    function toBase64Unicode(str){return btoa(unescape(encodeURIComponent(str)));}

    async function pushDataJsToGitHub(token,payload){
      const content='window.__SHARED_DATA__='+JSON.stringify(payload)+';';
      const apiBase='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH;
      const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
      let sha=null;
      const getRes=await fetch(apiBase+'?ref=main',{headers});
      if(getRes.ok)sha=(await getRes.json()).sha;
      else if(getRes.status!==404){const err=await getRes.json().catch(()=>({}));throw new Error(err.message||('GET '+getRes.status));}
      const body={message:'Cập nhật bảng công '+(payload.title||'')+' ('+payload.employees.length+' NV)',content:toBase64Unicode(content),branch:'main'};
      if(sha)body.sha=sha;
      const putRes=await fetch(apiBase,{method:'PUT',headers:Object.assign({},headers,{'Content-Type':'application/json'}),body:JSON.stringify(body)});
      if(!putRes.ok){const err=await putRes.json().catch(()=>({}));throw new Error(err.message||('PUT '+putRes.status));}
      return putRes.json();
    }

    function num(v){if(v==null||v==='')return 0;const n=Number(v);return isNaN(n)?0:n;}
    function cellVal(ws,r,c){const cell=ws[XLSX.utils.encode_cell({r:r,c:c})];return cell?cell.v:null;}

    function buildSharedPayload(workbook,fileName){
      const all=[];let year=monthInfo.year,month=monthInfo.month;
      for(const sheetName of workbook.SheetNames){
        const ws=workbook.Sheets[sheetName];if(!ws)continue;
        const range=XLSX.utils.decode_range(ws['!ref']||'A1');
        const parsed=parseSheet(ws,range,sheetName);
        if(parsed.list.length){all.push.apply(all,parsed.list);if(parsed.y)year=parsed.y;if(parsed.m)month=parsed.m;}
      }
      if(!all.length)throw new Error('Không tìm thấy nhân viên');
      const KEEP={actualWorkDays:1,paidWorkDays:1,totalOT:1,otDay:1,otNight:1,sundayDay:1,sundayNight:1,holidayDay:1,holidayNight:1,totalPaidLeave:1,totalUnpaidLeave:1,otSubsidyCount:1,forgotPunch:1,lateOver10:1,lateUnder10:1};
      const employeesOut=all.map(e=>{
        const summary={};Object.keys(e.summary||{}).forEach(k=>{if(KEEP[k]&&e.summary[k])summary[k]=e.summary[k];});
        const hours={};Object.keys(e.hours||{}).forEach(cat=>{const d=e.hours[cat];if(d&&Object.keys(d).length){const o={};Object.keys(d).forEach(day=>{if(d[day])o[day]=d[day];});if(Object.keys(o).length)hours[cat]=o;}});
        const leave={};Object.keys(e.leave||{}).forEach(d=>{if(e.leave[d])leave[d]=e.leave[d];});
        return{id:e.id,stt:e.stt,code:e.code,name:e.name,dept:e.dept,sheet:e.sheet,leave:leave,hours:hours,summary:summary};
      });
      return{title:'Bảng chấm công tháng '+month+'/'+year,year:year,month:month,updated:new Date().toISOString().slice(0,19),source:fileName,employees:employeesOut};
    }

    function parseSheet(ws,range,sheetName){
      const result=[];let headerRow=-1;
      for(let r=0;r<=Math.min(10,range.e.r);r++){if(String(cellVal(ws,r,0)||'').trim()==='STT'){headerRow=r;break;}}
      if(headerRow<0)return{list:[],y:null,m:null};
      const dateCols=[];let y=null,m=null;
      for(let c=6;c<=range.e.c;c++){
        const v=cellVal(ws,headerRow,c);
        if(v instanceof Date){dateCols.push({col:c,day:v.getDate()});if(y==null){y=v.getFullYear();m=v.getMonth()+1;}}
        else if(typeof v==='number'&&v>40000){const d=XLSX.SSF.parse_date_code(v);if(d){dateCols.push({col:c,day:d.d});if(y==null){y=d.y;m=d.m;}}}
        else if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v)){const dt=new Date(v);dateCols.push({col:c,day:dt.getDate()});if(y==null){y=dt.getFullYear();m=dt.getMonth()+1;}}
        else if(dateCols.length>20)break;
      }
      for(let r=headerRow+1;r<=range.e.r;r++){
        const stt=cellVal(ws,r,0);
        if(stt==null||typeof stt!=='number'||stt<1)continue;
        const code=String(cellVal(ws,r,1)||'').trim();
        const name=String(cellVal(ws,r,2)||'').trim();
        const dept=String(cellVal(ws,r,3)||'').trim();
        if(!code&&!name)continue;
        const emp={id:sheetName+'-'+stt+'-'+code,stt:stt,code:code,name:name,dept:dept,sheet:sheetName,leave:{},hours:{dayAdmin:{},dayOT:{},nightAdmin:{},nightOT:{},holidayDay:{},holidayNight:{},sundayDay:{},sundayNight:{}},summary:{}};
        dateCols.forEach(d=>{const v=cellVal(ws,r,d.col);if(v!=null&&v!=='')emp.leave[d.day]=String(v).trim();});
        emp.summary.forgotPunch=num(cellVal(ws,r,38));emp.summary.lateUnder10=num(cellVal(ws,r,39));emp.summary.lateOver10=num(cellVal(ws,r,40));
        emp.summary.actualWorkDays=num(cellVal(ws,r,41));emp.summary.paidWorkDays=num(cellVal(ws,r,43));
        emp.summary.otDay=num(cellVal(ws,r,44));emp.summary.otNight=num(cellVal(ws,r,45));
        emp.summary.sundayDay=num(cellVal(ws,r,46));emp.summary.sundayNight=num(cellVal(ws,r,47));
        emp.summary.holidayDay=num(cellVal(ws,r,48));emp.summary.holidayNight=num(cellVal(ws,r,49));
        emp.summary.totalOT=num(cellVal(ws,r,50));emp.summary.totalPaidLeave=num(cellVal(ws,r,55));
        emp.summary.totalUnpaidLeave=num(cellVal(ws,r,62));emp.summary.otSubsidyCount=num(cellVal(ws,r,63));
        [[1,'dayAdmin'],[2,'dayOT'],[3,'nightAdmin'],[4,'nightOT'],[5,'holidayDay'],[6,'holidayNight'],[7,'sundayDay'],[8,'sundayNight']].forEach(function(pair){
          const off=pair[0],key=pair[1],rr=r+off;if(rr>range.e.r)return;
          dateCols.forEach(function(d){const v=num(cellVal(ws,rr,d.col));if(v!==0)emp.hours[key][d.day]=v;});
        });
        result.push(emp);
      }
      return{list:result,y:y,m:m};
    }

    function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    loadSharedData();
  </script>
